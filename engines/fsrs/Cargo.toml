[package]
name = "dstu-fsrs-jni"
version = "0.1.0"
edition = "2024"
publish = false
license = "BSD-3-Clause"
description = "JNI bridge to the frozen fsrs 6.6.2 crate"

[lib]
name = "dstu_fsrs"
crate-type = ["cdylib", "rlib"]

[dependencies]
fsrs = "=6.6.2"
jni = "=0.21.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
